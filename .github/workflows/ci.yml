name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: '3.11'
      - name: Python environment
        run: |
          ${{ steps.py.outputs.python-path }} -m venv /tmp/hw-portfolio-venv
          /tmp/hw-portfolio-venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/hw-portfolio-venv/bin/pip install -q -r requirements.txt
      - name: python3 test_qat.py
        run: |
          source /tmp/hw-portfolio-venv/bin/activate
          python3 test_qat.py
